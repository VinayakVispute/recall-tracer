# Render Blueprint: one Docker web service (page + API). Point FALKORDB_* at FalkorDB Cloud; the graph is reseeded on every deploy.
services:
  - type: web
    name: recall-tracer
    runtime: docker
    plan: starter
    healthCheckPath: /outbreak
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_TLS
        value: "false"
