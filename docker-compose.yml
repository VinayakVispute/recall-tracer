# One command: FalkorDB + the app (page and API). Needs ANTHROPIC_API_KEY in .env for live runs.
services:
  falkordb:
    image: falkordb/falkordb:latest
    volumes: [falkordb_compose:/var/lib/falkordb/data]
  app:
    build: .
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    ports: ["${APP_PORT:-3000}:3000"]
    depends_on: [falkordb]
volumes:
  falkordb_compose:
