<!doctype html>
<meta charset="utf-8">
<title>Recall Tracer cover</title>
<!-- Blog cover, 1000x420 (dev.to size). Pick a look with ?theme=paper|dark|blue|mono. Rendered to cover-*.png by cover.mjs. -->
<style>
  :root { --bg: #f4f2ec; --grid: #e6e3db; --fg: #1c1c1a; --muted: #4a4944; --foot: #5a5955; --accent: #d9622b;
          --pill-bg: #1c1c1a; --pill-fg: #fff; --panel: #ebe9e1; --panel-border: #1c1c1a; --edge: #b9b6ad; --node: #6b6a66; --lot: #1c1c1a; }
  html[data-theme=dark] { --bg: #15161a; --grid: #23252b; --fg: #f3f1ea; --muted: #b9b6ad; --foot: #8b897f; --accent: #ff7a3d;
          --pill-bg: #f3f1ea; --pill-fg: #15161a; --panel: #1d1f25; --panel-border: #f3f1ea; --edge: #474a54; --node: #8b897f; --lot: #f3f1ea; }
  html[data-theme=blue] { --bg: #eef2f6; --grid: #dde3ea; --fg: #0f1f33; --muted: #3f5068; --foot: #5a6b82; --accent: #1f5fbf;
          --pill-bg: #0f1f33; --pill-fg: #fff; --panel: #e3e9f0; --panel-border: #0f1f33; --edge: #b4bec9; --node: #6b7b8f; --lot: #0f1f33; }
  html[data-theme=mono] { --bg: #fff; --grid: #e9e9e9; --fg: #000; --muted: #333; --foot: #555; --accent: #000;
          --pill-bg: #000; --pill-fg: #fff; --panel: #f3f3f3; --panel-border: #000; --edge: #c8c8c8; --node: #777; --lot: #000; }
  html[data-theme=mono] h1 em { background: #000; color: #fff; padding: 0 10px; }

  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 420px; overflow: hidden; background: var(--bg); }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--fg); }
  .wrap { position: relative; width: 1000px; height: 420px; padding: 44px 48px; background: var(--bg);
          background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 28px 28px; }
  .eyebrow { font-family: ui-monospace, Menlo, monospace; font-size: 15px; letter-spacing: .08em; display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content: ""; width: 10px; height: 14px; background: var(--accent); }
  h1 { margin-top: 24px; font-size: 40px; line-height: 1.1; font-weight: 800; letter-spacing: -.015em; width: 540px; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 22px; font-size: 18px; color: var(--muted); }
  .pill { margin-top: 22px; display: inline-block; background: var(--pill-bg); color: var(--pill-fg); font-weight: 700; font-size: 18px; padding: 10px 18px; border-radius: 10px; }
  .foot { position: absolute; left: 48px; bottom: 34px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--foot); }
  svg { position: absolute; right: 44px; top: 40px; width: 340px; height: 340px; background: var(--panel); border: 2px solid var(--panel-border); }
  .e { stroke: var(--edge); stroke-width: 2; fill: none; }
  .hot { stroke: var(--accent); stroke-width: 2.5; }
  .gap { stroke: var(--accent); stroke-dasharray: 5 4; }
  .n { fill: var(--panel); stroke: var(--node); stroke-width: 2; }
  .n.hot { fill: var(--accent); stroke: var(--accent); }
  .n.lot { fill: var(--lot); stroke: var(--lot); }
  text { font-family: ui-monospace, Menlo, monospace; font-size: 11px; fill: var(--muted); }
</style>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'paper';</script>
<div class="wrap">

  <div class="pill">Built on FalkorDB</div>
  <div class="foot">L-204: 33 stores pulled, 38 cleared by their records, 2 asked a human</div>
